name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reconops
          POSTGRES_PASSWORD: reconops
          POSTGRES_DB: reconops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reconops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      RECONOPS_DATABASE_URL: postgresql://reconops:reconops@localhost:5432/reconops_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run Alembic migrations
        run: alembic upgrade head
      - name: Unit tests
        run: python -m pytest -q
      - name: Eval (snapshot + synthetic corrections)
        run: python -m app.eval
      - name: Eval self-test — injected bad rule must be caught
        run: "! python -m app.eval --inject-bad-rule"

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  prod-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backend image
        run: docker build -t reconops-backend ./backend
      - name: Edge image (frontend build + Caddy)
        run: docker build -t reconops-edge -f deploy/Dockerfile.edge .
