services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=reconops
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set in .env}
      - POSTGRES_DB=reconops
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*
    depends_on:
      - postgres
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:?set in .env}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-}
      - ANTHROPIC_ROW_MODEL=${ANTHROPIC_ROW_MODEL:-claude-haiku-4-5}
      - RECONOPS_MAX_LLM_ROWS=${RECONOPS_MAX_LLM_ROWS:-25}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - RECONOPS_ENV=${RECONOPS_ENV:-production}
      - RECONOPS_CORS_ORIGINS=${RECONOPS_CORS_ORIGINS:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - RECONOPS_SECRET=${RECONOPS_SECRET:-}
      - RECONOPS_DATABASE_URL=postgresql://reconops:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/reconops
      - RECONOPS_S3_BUCKET=${RECONOPS_S3_BUCKET:?set in .env}
      - RECONOPS_S3_REGION=${RECONOPS_S3_REGION:-us-east-1}
      - RECONOPS_S3_ENDPOINT_URL=${RECONOPS_S3_ENDPOINT_URL:-}
      - RECONOPS_S3_ACCESS_KEY_ID=${RECONOPS_S3_ACCESS_KEY_ID:-}
      - RECONOPS_S3_SECRET_ACCESS_KEY=${RECONOPS_S3_SECRET_ACCESS_KEY:-}
    volumes:
      - reconops-data:/app/data

  edge:
    build:
      context: .
      dockerfile: deploy/Dockerfile.edge
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Empty/unset -> ":80" (plain HTTP, local runs). A real domain -> auto-HTTPS.
      - RECONOPS_DOMAIN=${RECONOPS_DOMAIN:-:80}
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  reconops-data:
  postgres-data:
  caddy-data:
  caddy-config:
