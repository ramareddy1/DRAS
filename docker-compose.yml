services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=reconops
      - POSTGRES_PASSWORD=reconops
      - POSTGRES_DB=reconops
    ports:
      - "5432:5432"
    volumes:
      - reconops-postgres-data:/var/lib/postgresql/data
      - ./backend/postgres-init:/docker-entrypoint-initdb.d:ro

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - RECONOPS_DATABASE_URL=postgresql://reconops:reconops@postgres:5432/reconops
    volumes:
      - ./backend/data:/app/data

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  reconops-postgres-data:
