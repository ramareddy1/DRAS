services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=reconops
      - POSTGRES_PASSWORD=reconops
      - POSTGRES_DB=reconops
    ports:
      - "5432:5432"
    volumes:
      - reconops-postgres-data:/var/lib/postgresql/data
      - ./backend/postgres-init:/docker-entrypoint-initdb.d:ro

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=reconops
      - MINIO_ROOT_PASSWORD=reconops123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - reconops-minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://minio:9000 reconops reconops123) do sleep 1; done;
      /usr/bin/mc mb -p local/reconops-dev;
      exit 0;
      "

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - minio-init
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - RECONOPS_AUTH_DEV=${RECONOPS_AUTH_DEV:-1}
      - RECONOPS_DATABASE_URL=postgresql://reconops:reconops@postgres:5432/reconops
      - RECONOPS_S3_BUCKET=reconops-dev
      - RECONOPS_S3_REGION=us-east-1
      - RECONOPS_S3_ENDPOINT_URL=http://minio:9000
      - RECONOPS_S3_ACCESS_KEY_ID=reconops
      - RECONOPS_S3_SECRET_ACCESS_KEY=reconops123
    volumes:
      - ./backend/data:/app/data

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  reconops-postgres-data:
  reconops-minio-data:
